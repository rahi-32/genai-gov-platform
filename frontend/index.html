<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Governance Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-button {
            padding: 12px 30px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tab-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .tab-button.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 14px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 0.9em;
        }

        .request-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .request-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .request-item.high {
            border-left-color: #e74c3c;
        }

        .request-item.medium {
            border-left-color: #f39c12;
        }

        .request-item.low {
            border-left-color: #27ae60;
        }

        .priority-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .priority-high {
            background: #e74c3c;
            color: white;
        }

        .priority-medium {
            background: #f39c12;
            color: white;
        }

        .priority-low {
            background: #27ae60;
            color: white;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #3498db;
            color: white;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏛️ GenAI Governance Platform</h1>
            <p>AI-Powered Citizen Service Delivery System</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('citizen')">
                👤 Citizen Portal
            </button>
            <button class="tab-button" onclick="switchTab('admin')">
                📊 Admin Dashboard
            </button>
        </div>

        <!-- Citizen Portal Tab -->
        <div id="citizen-tab" class="tab-content active">
            <div class="card">
                <h2 style="margin-bottom: 20px; color: #333;">Submit Service Request</h2>
                
                <div id="citizen-alert"></div>

                <form id="citizen-form">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" required placeholder="your.email@example.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" required placeholder="9876543210">
                    </div>

                    <div class="form-group">
                        <label for="request-type">Request Type *</label>
                        <select id="request-type" required>
                            <option value="">Select service type</option>
                            <option value="Water">Water Supply</option>
                            <option value="Electricity">Electricity</option>
                            <option value="Roads">Road Repair</option>
                            <option value="Garbage Collection">Garbage Collection</option>
                            <option value="Street Lights">Street Lights</option>
                            <option value="Drainage">Drainage</option>
                            <option value="Medical">Medical Emergency</option>
                            <option value="Public Transport">Public Transport</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="location">Location *</label>
                        <input type="text" id="location" required placeholder="e.g., Delhi, Sector 12">
                    </div>

                    <div class="form-group">
                        <label for="description">Description *</label>
                        <textarea id="description" required placeholder="Describe your issue in detail..."></textarea>
                    </div>

                    <button type="submit" class="btn">
                        🚀 Submit Request
                    </button>
                </form>
            </div>
        </div>

        <!-- Admin Dashboard Tab -->
        <div id="admin-tab" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="total-requests">0</h3>
                    <p>Total Requests</p>
                </div>
                <div class="stat-card">
                    <h3 id="high-priority">0</h3>
                    <p>High Priority</p>
                </div>
                <div class="stat-card">
                    <h3 id="avg-resolution">0</h3>
                    <p>Avg Resolution (days)</p>
                </div>
                <div class="stat-card">
                    <h3 id="resolved-count">0</h3>
                    <p>Resolved</p>
                </div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="color: #333;">Recent Service Requests</h2>
                    <button class="btn" style="width: auto; padding: 10px 20px;" onclick="loadDashboard()">
                        🔄 Refresh
                    </button>
                </div>
                
                <div id="requests-container" class="request-list">
                    <div class="loading">Loading requests...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000';

        // Switch between tabs
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            if (tab === 'citizen') {
                document.getElementById('citizen-tab').classList.add('active');
            } else {
                document.getElementById('admin-tab').classList.add('active');
                loadDashboard();
            }
        }

        // Handle citizen form submission
        document.getElementById('citizen-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const alertDiv = document.getElementById('citizen-alert');
            alertDiv.innerHTML = '';

            const data = {
                citizen_name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                request_type: document.getElementById('request-type').value,
                location: document.getElementById('location').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch(`${API_URL}/api/requests/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    alertDiv.innerHTML = `
                        <div class="alert alert-success">
                            ✅ Request submitted successfully!<br>
                            <strong>Request ID:</strong> ${result.id}<br>
                            <strong>Priority:</strong> ${result.priority}<br>
                            <strong>Estimated Resolution:</strong> ${result.predicted_resolution_days} days
                        </div>
                    `;
                    document.getElementById('citizen-form').reset();
                } else {
                    throw new Error('Failed to submit request');
                }
            } catch (error) {
                alertDiv.innerHTML = `
                    <div class="alert alert-error">
                        ❌ Error: Could not submit request. Please make sure the backend server is running.
                    </div>
                `;
            }
        });

        // Load admin dashboard
        async function loadDashboard() {
            const container = document.getElementById('requests-container');
            container.innerHTML = '<div class="loading">Loading requests...</div>';

            try {
                // Fetch dashboard data
                const dashResponse = await fetch(`${API_URL}/api/analytics/dashboard`);
                const dashData = await dashResponse.json();

                // Update stats
                document.getElementById('total-requests').textContent = dashData.total_requests;
                document.getElementById('high-priority').textContent = dashData.priority_breakdown.high;
                document.getElementById('avg-resolution').textContent = dashData.avg_resolution_time.toFixed(1);
                document.getElementById('resolved-count').textContent = dashData.status_breakdown.resolved;

                // Fetch all requests
                const reqResponse = await fetch(`${API_URL}/api/requests/all`);
                const requests = await reqResponse.json();

                if (requests.length === 0) {
                    container.innerHTML = '<div class="no-data">No requests submitted yet.</div>';
                    return;
                }

                // Display requests
                container.innerHTML = requests.map(req => `
                    <div class="request-item ${req.priority.toLowerCase()}">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                            <div>
                                <strong style="font-size: 1.1em;">Request #${req.id}</strong>
                                <span class="priority-badge priority-${req.priority.toLowerCase()}">${req.priority}</span>
                                <span class="status-badge">${req.status}</span>
                            </div>
                            <div style="text-align: right; color: #666; font-size: 0.9em;">
                                ${new Date(req.created_at).toLocaleString()}
                            </div>
                        </div>
                        <div style="margin-bottom: 8px;">
                            <strong>👤 Name:</strong> ${req.citizen_name} | 
                            <strong>📧 Email:</strong> ${req.email}
                        </div>
                        <div style="margin-bottom: 8px;">
                            <strong>🏷️ Type:</strong> ${req.request_type} | 
                            <strong>📍 Location:</strong> ${req.location}
                        </div>
                        <div style="margin-bottom: 8px;">
                            <strong>📝 Description:</strong> ${req.description}
                        </div>
                        <div style="color: #667eea; font-weight: 600;">
                            ⏱️ Estimated Resolution: ${req.predicted_resolution_days} days
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-error">
                        ❌ Error: Could not load dashboard. Please make sure the backend server is running at ${API_URL}
                    </div>
                `;
            }
        }

        // Auto-load dashboard when page loads
        window.addEventListener('load', () => {
            // Give backend time to start
            setTimeout(() => {
                if (document.getElementById('admin-tab').classList.contains('active')) {
                    loadDashboard();
                }
            }, 500);
        });
    </script>
</body>
</html>
